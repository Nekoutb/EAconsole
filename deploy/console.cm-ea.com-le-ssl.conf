<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName console.cm-ea.com
    DocumentRoot /var/www/console.cm-ea.com

    <Directory /var/www/console.cm-ea.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/console.cm-ea.com-error.log
    CustomLog ${APACHE_LOG_DIR}/console.cm-ea.com-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    <FilesMatch "\.(html|js|css|json|svg)$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </FilesMatch>

    SSLCertificateFile /etc/letsencrypt/live/console.cm-ea.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/console.cm-ea.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Location "/">
        AuthType Basic
        AuthName "Elite Advisors IT Operations"
        AuthUserFile /etc/eaconsole/.htpasswd
        Require valid-user
    </Location>
</VirtualHost>
</IfModule>
